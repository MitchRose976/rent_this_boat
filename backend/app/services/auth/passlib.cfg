[passlib]
# Password hashing configuration using Argon2
# This file can be referenced via PASSLIB_CONFIG_PATH environment variable

# Schemes to support (argon2 is current default)
schemes = argon2

# Deprecated schemes (empty for now, can add old algorithms for backward compatibility)
deprecated =

# Argon2 parameters (OWASP recommended for general use)
# memory_cost: 32768 KB = 32 MB of memory
# time_cost: 4 iterations
# parallelism: 4 parallel threads
argon2__memory_cost = 32768
argon2__time_cost = 4
argon2__parallelism = 4
